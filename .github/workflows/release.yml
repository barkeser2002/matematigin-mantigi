name: Release (Windows + macOS)

# main'e her push'ta Windows (.exe + Kurulum.exe) ve macOS .app üretir, hepsini bir GitHub Release'e ekler.
# Her derleme önce _build.py'ye BUILD=run numarasını yazar; uygulama güncellemeyi 'build-N' etiketiyle karşılaştırır.
# Elle de çalıştırılabilir (Actions > Release > Run workflow). Daldan elle çalıştırılırsa yalnız derler
# (artifact'ler run sayfasında); Release yalnız main'den yayınlanır. Sürümler constraints.txt'ten gelir.
#
# Yalnız belge/grafik dosyaları değişen push release üretmez (paths-ignore). Push'taki değişikliklerden
# BİRİ bile bu listenin dışındaysa (src/, tests/, constraints.txt, workflow, spec...) release yine çıkar:
# README ile kod aynı push'ta gelirse derleme çalışır. workflow_dispatch bundan etkilenmez.
# Görsel uzantıları bilerek yalnız kök dizinde ve docs/ altında yok sayılır: sorular_gorsel/*.png pakete girer.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "graphify-out/**"
      - "uploads/**"
      - "*.dc.html"
      - "image-slot.js"
      - "support.js"
      - "*.png"
      - "*.jpg"
      - "*.jpeg"
      - "*.gif"
      - "*.svg"
      - "*.webp"
  workflow_dispatch:

permissions:
  contents: write        # release yayınlamak için gerekli

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Yapı numarasını yaz (uygulama kendi sürümünü ve güncellemeyi buradan bilir)
        shell: bash
        run: echo 'BUILD = "${{ github.run_number }}"' > src/matematigin_mantigi/_build.py
      - name: Paketle (.venv + testler + PyInstaller + Inno Setup kurulum programı)
        run: powershell -ExecutionPolicy Bypass -File windows\build_win.ps1
      - name: Geçici açılış tanısı
        if: failure()
        env:
          MM_CI_TRACE: "1"
          PYTHONFAULTHANDLER: "1"
          PYTHONUTF8: "1"
          QT_QPA_PLATFORM: offscreen
        run: .\.venv\Scripts\python.exe -m pytest -x -vv --tb=long tests/test_acilis_ekran_son_durum.py
      - name: Zip
        run: Compress-Archive -Path "dist\Matematigin Mantigi\*" -DestinationPath "Matematigin-Mantigi-Windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Matematigin-Mantigi-Windows
          path: Matematigin-Mantigi-Windows.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Matematigin-Mantigi-Kurulum
          path: kurulum/Matematigin-Mantigi-Kurulum.exe
          if-no-files-found: error

  macos:
    runs-on: macos-15        # arm64 (Apple Silicon)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Yapı numarasını yaz (uygulama kendi sürümünü ve güncellemeyi buradan bilir)
        run: echo 'BUILD = "${{ github.run_number }}"' > src/matematigin_mantigi/_build.py
      - name: Paketle (.venv + testler + PyInstaller)
        run: bash mac/build_mac.sh
      - name: Zip
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent "Matematiğin Mantığı.app" "Matematigin-Mantigi-macOS.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Matematigin-Mantigi-macOS
          path: dist/Matematigin-Mantigi-macOS.zip
          if-no-files-found: error

  release:
    needs: [windows, macos]
    if: github.ref == 'refs/heads/main'      # dal derlemeleri Release yayınlamaz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Yapı ${{ github.run_number }}
          body: |
            Otomatik yapı (commit ${{ github.sha }}).
            - Windows (önerilen): Matematigin-Mantigi-Kurulum.exe — çalıştır; Başlat menüsüne kurulur, yönetici izni istemez.
              İmzasız olduğu için SmartScreen "Windows bilgisayarınızı korudu" derse: Ek bilgi > Yine de çalıştır.
              Sonraki sürümleri uygulama açılışta kendisi sorar ve kurar.
            - Windows (kurulumsuz): Matematigin-Mantigi-Windows.zip — aç, klasörü kopyala, "Matematigin Mantigi.exe" çalıştır.
            - macOS: Matematigin-Mantigi-macOS.zip — zipi aç, .app'i Uygulamalar'a taşı.
              Uygulama Apple tarafından onaylı değil; açılmazsa ya da "hasarlı" derse Terminal'de şunu çalıştır:
              xattr -dr com.apple.quarantine "/Applications/Matematiğin Mantığı.app"
              Başka yol: Sistem Ayarları > Gizlilik ve Güvenlik > "Yine de Aç" (macOS 15'te sağ tık > Aç artık işe yaramıyor).
              Her yeni sürümde kamera, mikrofon ve ekran kaydı izinleri yeniden istenebilir (imza her derlemede değişir).
          files: |
            artifacts/Matematigin-Mantigi-Windows/Matematigin-Mantigi-Windows.zip
            artifacts/Matematigin-Mantigi-Kurulum/Matematigin-Mantigi-Kurulum.exe
            artifacts/Matematigin-Mantigi-macOS/Matematigin-Mantigi-macOS.zip
          fail_on_unmatched_files: true
